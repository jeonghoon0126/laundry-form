name: Monthly Invoice Generation

on:
  schedule:
    # 매월 말일 09시 (KST) = UTC 00:00.
    # 말일이 월요일이면 전날 일요일에 같은 정산을 실행한다.
    # 2월 말일이 월요일인 경우의 전날(27일)까지 포함한다.
    - cron: '0 0 27-31 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (YYYY)'
        required: false
      month:
        description: 'Month (1-12)'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check settlement run day
        id: check_day
        run: |
          export TZ=Asia/Seoul
          today=$(date +%F)
          weekday=$(date +%u)
          last_date=$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%F)
          tomorrow=$(date -d "$today + 1 day" +%F)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$weekday" = "7" ] && [ "$tomorrow" = "$last_date" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "year=$(date +%Y)" >> $GITHUB_OUTPUT
            echo "month=$(date +%m)" >> $GITHUB_OUTPUT
            echo "말일이 월요일이라 전날 일요일에 정산을 실행합니다."
          elif [ "$today" = "$last_date" ] && [ "$weekday" != "1" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "year=$(date +%Y)" >> $GITHUB_OUTPUT
            echo "month=$(date +%m)" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "오늘($today)은 정산 실행일이 아님. 스킵."
          fi

      - name: Set up Python
        if: steps.check_day.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts
        if: steps.check_day.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        if: steps.check_day.outputs.run == 'true'
        run: |
          pip install psycopg2-binary reportlab openpyxl "google-auth>=2.0,<2.49" requests

      - name: Generate invoices
        if: steps.check_day.outputs.run == 'true'
        env:
          SUPABASE_URI: ${{ secrets.SUPABASE_URI }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SHEETS_SERVICE_ACCOUNT: ${{ secrets.SHEETS_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.month }}" ]; then
            python scripts/generate_invoices.py ${{ inputs.year }} ${{ inputs.month }}
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/generate_invoices.py
          else
            python scripts/generate_invoices.py ${{ steps.check_day.outputs.year }} ${{ steps.check_day.outputs.month }}
          fi
